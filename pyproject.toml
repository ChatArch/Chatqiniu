[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Chatqiniu"
dynamic = ["version"]
description = "Chatqiniu: ChatArch Python package for Qiniu workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0,<9.0",
    "chatstyle>=0.2.0,<0.3.0",
    "chatenv>=0.2.10,<0.3.0",
    "requests>=2.31.0,<3.0",
    "qiniu>=7.17.0,<8.0",
]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatqiniu", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/Chatqiniu"
Repository = "https://github.com/ChatArch/Chatqiniu"
Documentation = "https://arch.gh.wzhecnu.cn/Chatqiniu/"

[project.scripts]
chatqiniu = "chatqiniu.cli:main"

[project.entry-points."chatenv.configs"]
qiniu = "chatqiniu.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<9.7",
    "mkdocs-static-i18n>=1.2,<2.0",
    "mike>=2.0,<3.0",
]

[tool.setuptools.dynamic]
version = {attr = "chatqiniu.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
markers = [
    "live: real read-only Qiniu API smoke tests gated by CHATQINIU_RUN_LIVE_TESTS=1",
]
