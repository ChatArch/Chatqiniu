name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest -q
      - name: Verify installed CLI contract
        run: |
          chatqiniu --version
          chatqiniu --tree
          chatqiniu --tree-brief
      - name: Verify installed ChatEnv provider
        env:
          CHATARCH_HOME: ${{ runner.temp }}/chatqiniu-chatenv-editable
        run: |
          chatenv --home "$CHATARCH_HOME" list
          chatenv --home "$CHATARCH_HOME" test -t qiniu -I
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify built wheel CLI contract
        run: |
          python -m venv "$RUNNER_TEMP/chatqiniu-wheel"
          "$RUNNER_TEMP/chatqiniu-wheel/bin/python" -m pip install dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/chatqiniu-wheel/bin/chatqiniu" --version
            "$RUNNER_TEMP/chatqiniu-wheel/bin/chatqiniu" --tree
            "$RUNNER_TEMP/chatqiniu-wheel/bin/chatqiniu" --tree-brief
            "$RUNNER_TEMP/chatqiniu-wheel/bin/chatenv" \
              --home "$RUNNER_TEMP/chatqiniu-wheel-home" test -t qiniu -I
          )
      - run: mkdocs build --strict
